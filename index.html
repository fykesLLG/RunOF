<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5aa7ff">
<title>RunOF</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#5aa7ff;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none;
    touch-action:none;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(20,30,60,.32) 100%);
  }

  /* Мгновенная вспышка трети экрана при тапе */
  #laneFlash{
    position:fixed;top:0;bottom:0;width:33.334%;left:0;
    z-index:3;pointer-events:none;opacity:0;
    background:linear-gradient(180deg, rgba(255,216,74,.32), rgba(255,216,74,.02));
    transition:opacity .22s;
  }

  /* ============ ЭКРАНЫ ============ */
  .screen{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding:22px;text-align:center;
    background:radial-gradient(1200px 700px at 50% 0%,#7bb8ff 0%,#4a7cd8 40%,#2a4a8f 100%);
    overflow-y:auto;
  }
  .screen.hidden{display:none}
  .logo{
    font-size:clamp(52px,15vw,86px);font-weight:900;letter-spacing:-.045em;line-height:.9;
    text-shadow:0 6px 22px rgba(0,0,0,.35);
  }
  .logo span{color:#ffd84a;text-shadow:0 4px 16px #ffb020aa}
  .subtitle{color:#d8e6ff;font-size:13px;margin:-6px 0 8px;letter-spacing:.15em;text-transform:uppercase}
  h2{margin:0 0 6px;font-size:clamp(22px,6vw,28px);font-weight:800;color:#fff;text-shadow:0 2px 8px #0004}
  .menu-btns{display:flex;flex-direction:column;gap:10px;width:min(340px,88vw)}
  .btn{
    appearance:none;border:1px solid rgba(255,255,255,.22);
    background:rgba(20,30,60,.55);backdrop-filter:blur(10px);color:#fff;
    padding:15px 20px;border-radius:15px;font-size:16px;font-weight:700;cursor:pointer;
    transition:transform .12s, background .15s; font-family:inherit;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.4);
  }
  .btn:hover{background:rgba(40,60,100,.7)}
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:linear-gradient(180deg,#ffd84a,#ffab2e);color:#5a3200;border-color:#ffe680;
    box-shadow:0 8px 28px -6px #ffb02099;
  }
  .btn.primary:hover{background:linear-gradient(180deg,#ffe46b,#ffbe3e)}
  .btn.danger{border-color:#e25577;background:rgba(120,30,50,.5);color:#ffb8c8}

  /* ============ РЕКЛАМА ADVEGO ============ */
  .advego-card{
    position:relative;display:flex;flex-direction:column;gap:9px;
    width:min(400px,94vw);margin-top:12px;
    padding:18px 20px;border-radius:20px;text-decoration:none;
    background:linear-gradient(135deg,#ffb020 0%,#ff8c42 45%,#ff4d9d 100%);
    color:#241202;
    box-shadow:0 14px 42px -12px #ff8c42aa, 0 0 0 1px #ffffff33 inset;
    overflow:hidden;transition:transform .2s, box-shadow .25s;
    animation:adPulse 3.2s ease-in-out infinite;
  }
  @keyframes adPulse{
    0%,100%{box-shadow:0 14px 42px -12px #ff8c42aa, 0 0 0 1px #ffffff33 inset}
    50%{box-shadow:0 18px 52px -8px #ffb020cc, 0 0 0 1px #ffffff55 inset}
  }
  .advego-card:hover{transform:translateY(-2px)}
  .advego-card::before{
    content:'';position:absolute;inset:-40% -10%;
    background:linear-gradient(45deg,transparent 42%,#ffffff55 50%,transparent 58%);
    transform:translateX(-100%);pointer-events:none;
    animation:adShine 4.5s ease-in-out infinite;
  }
  @keyframes adShine{
    0%,70%{transform:translateX(-100%) rotate(45deg)}
    100%{transform:translateX(120%) rotate(45deg)}
  }
  .advego-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
  .advego-logo{font-size:24px;font-weight:900;letter-spacing:.08em}
  .advego-badge{background:#24120255;color:#241202;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.1em}
  .advego-title{font-size:19px;font-weight:900;line-height:1.15;letter-spacing:-.01em;position:relative;z-index:1}
  .advego-sub{font-size:12.5px;font-weight:600;opacity:.82;position:relative;z-index:1}
  .advego-cta{
    display:inline-block;align-self:flex-start;background:#241202;color:#ffb020;
    padding:9px 18px;border-radius:11px;font-size:14px;font-weight:800;
    margin-top:4px;position:relative;z-index:1;box-shadow:0 4px 14px -4px #0006;
  }

  .lang-bar{display:flex;gap:6px;margin-top:12px}
  .lang-bar button{
    border:1px solid rgba(255,255,255,.25);background:rgba(20,30,60,.4);
    color:#d8e6ff;font-family:inherit;font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:10px;cursor:pointer;backdrop-filter:blur(6px);
  }
  .lang-bar button.active{background:#ffd84a;color:#5a3200;border-color:#ffe680}

  /* ============ HUD (не принимает события) ============ */
  #hud{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));
  }
  #hud.hidden{display:none}
  #hud *{pointer-events:none}
  .hud-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pill{
    display:flex;align-items:center;gap:8px;
    background:rgba(15,25,45,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.15);border-radius:13px;
    padding:7px 13px;font-size:13px;color:#fff;
    box-shadow:0 4px 16px -6px #0006;
  }
  .pill .k{color:#b8cce8;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .pill b{font-size:16px;font-variant-numeric:tabular-nums;color:#ffd84a}
  .combo-pill{background:linear-gradient(90deg,rgba(255,140,66,.85),rgba(255,77,157,.85))!important;border-color:#ffd84a!important}

  /* ============ ОБУЧЕНИЕ ============ */
  #tutorial{
    position:fixed;inset:0;z-index:9;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:20px 16px max(20px,env(safe-area-inset-bottom));
  }
  #tutorial.hidden{display:none}
  #tutorial *{pointer-events:none}
  .tut-step{
    background:rgba(15,25,45,.85);backdrop-filter:blur(10px);
    border:1px solid #ffd84a;border-radius:12px;padding:6px 14px;
    font-size:12px;font-weight:800;letter-spacing:.06em;color:#ffd84a;
    align-self:center;
  }
  .tut-skip{
    position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;
    pointer-events:auto!important;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(20,30,60,.85);color:#fff;font-family:inherit;
    font-size:12px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;
    backdrop-filter:blur(8px);
  }
  .tut-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
  .tut-text{
    background:linear-gradient(135deg,rgba(255,216,74,.96),rgba(255,171,46,.96));
    color:#5a3200;font-size:18px;font-weight:900;
    padding:14px 26px;border-radius:18px;
    box-shadow:0 10px 30px -8px #0008;
    text-align:center;max-width:92vw;line-height:1.25;
    animation:tutBounce .8s ease-in-out infinite;
  }
  @keyframes tutBounce{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-4px) scale(1.02)}
  }

  /* Подсветка нужной трети в обучении */
  #laneHint{position:fixed;inset:0;z-index:7;display:flex;pointer-events:none}
  #laneHint.hidden{display:none}
  #laneHint > div{
    flex:1;pointer-events:none;
    border:4px solid transparent;transition:border-color .2s, background .2s;
    display:flex;align-items:center;justify-content:center;
    font-size:88px;font-weight:900;color:transparent;
  }
  #laneHint > div.active{
    border-color:#ffd84a;
    background:rgba(255,216,74,.22);
    color:#ffd84a;
    text-shadow:0 4px 20px #0006;
    animation:hlPulse 1.1s ease-in-out infinite;
  }
  @keyframes hlPulse{
    0%,100%{background:rgba(255,216,74,.18)}
    50%{background:rgba(255,216,74,.34)}
  }

  /* ============ КНОПКА ПРЫЖКА ============ */
  #jumpBtn{
    position:fixed;
    right:max(18px,env(safe-area-inset-right) + 12px);
    bottom:max(22px,env(safe-area-inset-bottom) + 16px);
    width:88px;height:88px;border-radius:50%;
    border:3px solid #ffd84a;
    background:radial-gradient(circle at 30% 30%,#ffd84a,#ffab2e);
    color:#5a3200;font-size:36px;font-weight:900;
    display:none;align-items:center;justify-content:center;
    z-index:8;cursor:pointer;touch-action:none;
    box-shadow:0 8px 30px -6px #ffb020aa;
    transition:transform .1s;
    pointer-events:auto;
  }
  #jumpBtn.show{display:flex}
  #jumpBtn:active{transform:scale(.9)}
  #jumpBtn.on{transform:scale(.85);background:#ff8c42}
  #jumpBtn.highlight{animation:jumpHl 1s infinite}
  @keyframes jumpHl{
    0%,100%{box-shadow:0 8px 30px -6px #ffb020aa,0 0 0 0 #ffd84a}
    50%{box-shadow:0 8px 30px -6px #ffb020aa,0 0 0 18px #ffd84a00}
  }

  /* ============ GAME OVER ============ */
  .go-badge{
    background:linear-gradient(90deg,#ffd84a,#ffab2e);color:#5a3200;
    font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    padding:7px 16px;border-radius:999px;
    box-shadow:0 4px 16px -4px #ffb02099;
  }
  .go-badge.hidden{display:none}
  .go-score{
    font-size:clamp(50px,15vw,76px);font-weight:900;line-height:1;
    color:#fff;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 24px #0006;
  }
  .go-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .go-stats>div{
    display:flex;flex-direction:column;gap:3px;
    background:rgba(15,25,45,.6);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18);border-radius:13px;
    padding:10px 16px;min-width:88px;
  }
  .go-stats span{color:#b8cce8;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .go-stats b{font-size:18px;font-variant-numeric:tabular-nums;color:#ffd84a}

  /* ============ РЕКОРДЫ ============ */
  .records-list{display:flex;flex-direction:column;gap:7px;width:min(420px,92vw);margin:6px 0}
  .rec{
    display:flex;align-items:center;gap:12px;
    background:rgba(15,25,45,.6);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:11px 14px;
  }
  .rec-rank{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.12);color:#d8e6ff;font-size:13px;font-weight:800;
  }
  .rec:nth-child(1) .rec-rank{background:#ffd84a;color:#5a3200}
  .rec:nth-child(2) .rec-rank{background:#d8dce0;color:#333}
  .rec:nth-child(3) .rec-rank{background:#d08a4a;color:#fff}
  .rec-score{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;flex:1;text-align:left;color:#ffd84a}
  .rec-meta{color:#b8cce8;font-size:12.5px;font-variant-numeric:tabular-nums}
  .empty{color:#b8cce8;font-size:14px;padding:20px;text-align:center}

  /* ============ НАСТРОЙКИ ============ */
  .settings-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:min(420px,92vw);
    background:rgba(15,25,45,.55);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18);border-radius:13px;
    padding:11px 14px;font-size:14.5px;color:#fff;
  }
  .seg{display:flex;gap:4px;background:rgba(0,0,0,.35);border-radius:10px;padding:3px}
  .seg button{
    border:0;background:transparent;color:#b8cce8;font-family:inherit;
    font-size:13px;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer;
  }
  .seg button.active{background:#ffd84a;color:#5a3200}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="laneFlash"></div>
<div id="vignette"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-row">
    <div class="pill"><span class="k" data-i18n="score">Счёт</span><b id="hudScore">0</b></div>
    <div class="pill"><span class="k" data-i18n="coins">Монеты</span><b id="hudCoins">0</b></div>
    <div class="pill combo-pill hidden" id="comboPill"><span class="k">Combo</span><b id="hudCombo">0</b></div>
  </div>
</div>

<!-- Подсветка трети в обучении -->
<div id="laneHint" class="hidden">
  <div data-lane="0">1</div>
  <div data-lane="1">2</div>
  <div data-lane="2">3</div>
</div>

<!-- Обучение -->
<div id="tutorial" class="hidden">
  <button class="tut-skip" id="skipTut" data-i18n="skip">Пропустить</button>
  <div class="tut-step" id="tutStep">1 / 5</div>
  <div class="tut-bottom">
    <div class="tut-text" id="tutText">—</div>
  </div>
</div>

<button id="jumpBtn" aria-label="Jump">↑</button>

<!-- МЕНЮ -->
<div id="menu" class="screen">
  <div class="logo">Run<span>OF</span></div>
  <div class="subtitle" data-i18n="tagline">Бесконечный забег по поляне</div>
  <div class="menu-btns">
    <button class="btn primary" data-act="play" data-i18n="play">Играть</button>
    <button class="btn" data-act="records" data-i18n="records">Рекорды</button>
    <button class="btn" data-act="settings" data-i18n="settings">Настройки</button>
  </div>
  <a class="advego-card" href="https://advego.com/?ref=2rvF6he9RE" target="_blank" rel="noopener">
    <div class="advego-top">
      <span class="advego-logo">ADVEGO</span>
      <span class="advego-badge" data-i18n="ad">РЕКЛАМА</span>
    </div>
    <div class="advego-title" data-i18n="adTitle">Выполняйте тысячи заданий на Advego!</div>
    <div class="advego-sub" data-i18n="adSub">Копирайтинг · Рерайтинг · SEO · Уникальные тексты</div>
    <div class="advego-cta" data-i18n="adCta">Начать зарабатывать →</div>
  </a>
  <div class="lang-bar">
    <button data-lang="ru">Рус</button>
    <button data-lang="en">Eng</button>
    <button data-lang="zh">中文</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover" class="screen hidden">
  <div class="go-badge hidden" id="newRecord" data-i18n="newRecord">Новый рекорд!</div>
  <div class="go-score" id="goScore">0</div>
  <div class="go-stats">
    <div><span data-i18n="coins">Монеты</span><b id="goCoins">0</b></div>
    <div><span data-i18n="distance">Дистанция</span><b id="goDist">0</b></div>
    <div><span data-i18n="best">Рекорд</span><b id="goBest">0</b></div>
  </div>
  <div class="menu-btns">
    <button class="btn primary" data-act="restart" data-i18n="restart">Заново</button>
    <button class="btn" data-act="menu" data-i18n="menu">В меню</button>
  </div>
</div>

<!-- РЕКОРДЫ -->
<div id="records" class="screen hidden">
  <h2 data-i18n="records">Рекорды</h2>
  <div class="records-list" id="recordsList"></div>
  <button class="btn" data-act="back" data-i18n="back">Назад</button>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings" class="screen hidden">
  <h2 data-i18n="settings">Настройки</h2>
  <div class="settings-row">
    <span data-i18n="language">Язык</span>
    <div class="seg">
      <button data-lang="ru">Рус</button>
      <button data-lang="en">Eng</button>
      <button data-lang="zh">中文</button>
    </div>
  </div>
  <div class="settings-row">
    <span data-i18n="sound">Звук</span>
    <div class="seg">
      <button data-sound="1" data-i18n="on">Вкл</button>
      <button data-sound="0" data-i18n="off">Выкл</button>
    </div>
  </div>
  <div class="settings-row">
    <button class="btn danger" style="width:100%" data-act="reset" data-i18n="reset">Сбросить прогресс</button>
  </div>
  <button class="btn" data-act="back" data-i18n="back">Назад</button>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

/* ============ 1. ЛОКАЛИЗАЦИЯ ============ */
const I18N = {
  ru: {
    play:'Играть', records:'Рекорды', settings:'Настройки', back:'Назад',
    score:'Счёт', coins:'Монеты', best:'Рекорд', distance:'Дистанция',
    restart:'Заново', menu:'В меню', skip:'Пропустить',
    language:'Язык', sound:'Звук', on:'Вкл', off:'Выкл',
    reset:'Сбросить прогресс', resetConfirm:'Удалить все рекорды и монеты?',
    newRecord:'Новый рекорд!', empty:'Пока нет рекордов',
    tagline:'Бесконечный забег по поляне',
    ad:'РЕКЛАМА', adTitle:'Выполняйте тысячи заданий на Advego!',
    adSub:'Копирайтинг · Рерайтинг · SEO · Уникальные тексты', adCta:'Начать зарабатывать →',
    tut1:'ТАПНИ ЛЕВУЮ ТРЕТЬ ЭКРАНА',
    tut2:'ТАПНИ ПРАВУЮ ТРЕТЬ ЭКРАНА',
    tut3:'ТАПНИ СРЕДНЮЮ ТРЕТЬ',
    tut4:'НАЖМИ НА КНОПКУ ПРЫЖКА',
    tut5:'ГОТОВ! Собирай монеты и уклоняйся!'
  },
  en: {
    play:'Play', records:'Records', settings:'Settings', back:'Back',
    score:'Score', coins:'Coins', best:'Best', distance:'Distance',
    restart:'Restart', menu:'Menu', skip:'Skip',
    language:'Language', sound:'Sound', on:'On', off:'Off',
    reset:'Reset progress', resetConfirm:'Delete all records and coins?',
    newRecord:'New record!', empty:'No records yet',
    tagline:'Endless meadow runner',
    ad:'AD', adTitle:'Complete thousands of tasks on Advego!',
    adSub:'Copywriting · Rewriting · SEO · Unique texts', adCta:'Start earning →',
    tut1:'TAP THE LEFT THIRD OF THE SCREEN',
    tut2:'TAP THE RIGHT THIRD OF THE SCREEN',
    tut3:'TAP THE MIDDLE THIRD',
    tut4:'TAP THE JUMP BUTTON',
    tut5:'READY! Collect coins and dodge!'
  },
  zh: {
    play:'开始游戏', records:'记录', settings:'设置', back:'返回',
    score:'得分', coins:'金币', best:'最佳', distance:'距离',
    restart:'重新开始', menu:'主菜单', skip:'跳过',
    language:'语言', sound:'声音', on:'开', off:'关',
    reset:'重置进度', resetConfirm:'删除所有记录和金币？',
    newRecord:'新纪录！', empty:'暂无记录',
    tagline:'无尽草地跑酷',
    ad:'广告', adTitle:'在 Advego 完成数千个任务！',
    adSub:'文案 · 改写 · SEO · 原创文本', adCta:'开始赚钱 →',
    tut1:'点击屏幕左三分之一',
    tut2:'点击屏幕右三分之一',
    tut3:'点击屏幕中间三分之一',
    tut4:'点击跳跃按钮',
    tut5:'准备完毕！收集金币，躲避障碍！'
  }
};

/* ============ 2. СОХРАНЕНИЯ ============ */
const LS = { records:'runof.records.v4', settings:'runof.settings.v4', coins:'runof.coins.v4', firstRun:'runof.firstRun.v4' };
let settings = { lang:'ru', sound:true };
let records = [];
let totalCoins = 0;
let firstRun = true;
try {
  const s = JSON.parse(localStorage.getItem(LS.settings) || 'null');
  if (s) settings = Object.assign(settings, s);
  const r = JSON.parse(localStorage.getItem(LS.records) || '[]');
  if (Array.isArray(r)) records = r;
  totalCoins = +localStorage.getItem(LS.coins) || 0;
  firstRun = localStorage.getItem(LS.firstRun) === null;
} catch(e){}

let actx = null;
function beep(freq, dur, type='sine', vol=0.09){
  if (!settings.sound) return;
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  }catch(e){}
}
const haptic = (ms=12) => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

  if (btn){

    if (act === 'play')         startRun(true);

let flashTimeout = null;

  n = Math.max(0, Math.min(2, n));
  const f = $('laneFlash');
  if (!f) return;
  f.style.left = (n * 100 / 3) + '%';
  f.style.opacity = '1';
  clearTimeout(flashTimeout);

/* ============ 8. УПРАВЛЕНИЕ ============ */
function setLane(n){
  n = Math.max(0, Math.min(2, n));
  if (!game.running || isNaN(n)) return;
  // Всегда даём отклик (звук+вибро+вспышка), даже если полоса не меняется
  beep(520 + n * 90, 0.05, 'triangle', 0.05);
  haptic(8);
  flashLane(n);
  // Смена полосы
  if (n === game.lane) return;
  game.tilt = (n - game.lane) * 0.45;
  game.lane = n;
  game.lanePop = 1;
}

function doJump(){
  if (!game.running || !game.onGround) return;
  game.vy = JUMP_V;
  game.onGround = false;
  beep(760, 0.08, 'square', 0.06);
  haptic(14);
  $('jumpBtn').classList.add('on');
  setTimeout(() => $('jumpBtn').classList.remove('on'), 130);
}

/* ═══════════════ ГЛАВНЫЙ ОБРАБОТЧИК ТАПОВ ═══════════════
   Один обработчик на document в фазе capture.
   Работает ВСЕГДА, независимо от z-index и pointer-events. */
document.addEventListener('pointerdown', e => {
  if (!game.running) return;

  // Игнорируем UI
  const t = e.target;
  if (t.closest('.screen'))       return;
  if (t.closest('.tut-skip'))     return;
  if (t.closest('#jumpBtn'))      return;
  if (t.closest('.advego-card'))  return;
  if (t.closest('.lang-bar'))     return;
  if (t.closest('[data-act]'))    return;
  if (t.closest('[data-lang]'))   return;
  if (t.closest('[data-sound]'))  return;

  // Полоса по координате X
  const lane = Math.max(0, Math.min(2, Math.floor(e.clientX / (window.innerWidth / 3))));
  setLane(lane);
}, true); // capture: true — перехватываем раньше всех

/* Кнопка прыжка */
$('jumpBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); doJump();
});

/* Клавиатура */
window.addEventListener('keydown', e => {
  if (!game.running) return;
  const k = e.key;
  if (k==='1'||k==='ArrowLeft'||k==='a'||k==='A'||k==='ф'||k==='Ф'){ e.preventDefault(); setLane(0); }
  else if (k==='2'||k==='ArrowDown'||k==='s'||k==='S'||k==='ы'||k==='Ы'){ e.preventDefault(); setLane(1); }
  else if (k==='3'||k==='ArrowRight'||k==='d'||k==='D'||k==='в'||k==='В'){ e.preventDefault(); setLane(2); }
  else if (k===' '||k==='Spacebar'||k==='ArrowUp'||k==='w'||k==='W'||k==='ц'||k==='Ц'){ e.preventDefault(); doJump(); }
  else if (k==='Escape'){ if (tutorial.active) endTutorial(); else gameOver(); }
}, { passive:false });

/* ============ 9. ОБУЧЕНИЕ ============ */
const tutorial = { active:false, step:0, waitFor:null, timer:0, stuckTimer:0 };
const TUT_STEPS = [
  { key:'tut1', waitFor:'lane0', targetLane:0 },
  { key:'tut2', waitFor:'lane2', targetLane:2 },
  { key:'tut3', waitFor:'lane1', targetLane:1 },
  { key:'tut4', waitFor:'jump',  targetLane:-1 },
  { key:'tut5', waitFor:'done',  targetLane:-1 }
];

function startTutorial(){
  tutorial.active = true;
  tutorial.step = 0;
  tutorial.timer = 0;
  tutorial.stuckTimer = 0;
  tutorial.waitFor = null;
  $('tutorial').classList.remove('hidden');
  $('laneHint').classList.remove('hidden');
  showTutorialStep(0);
}

function showTutorialStep(n){
  const s = TUT_STEPS[n];
  if (!s){ endTutorial(); return; }
  tutorial.waitFor = s.waitFor;
  tutorial.step = n;
  tutorial.stuckTimer = 0;
  refreshTutorialText();

  // Подсветка нужной трети
  document.querySelectorAll('#laneHint > div').forEach(el => {
    const elLane = +el.dataset.lane;
    el.classList.toggle('active', s.targetLane >= 0 && elLane === s.targetLane);
  });
  $('jumpBtn').classList.toggle('highlight', s.waitFor === 'jump');

  if (s.waitFor === 'jump'){
    spawnObstacle(game.lane, 'low', -25);
  }
}

function refreshTutorialText(){
  const t = I18N[settings.lang] || I18N.ru;
  const s = TUT_STEPS[tutorial.step];
  if (!s) return;
  $('tutStep').textContent = (tutorial.step + 1) + ' / ' + TUT_STEPS.length;
  $('tutText').textContent = t[s.key] || '';
}

function advanceTutorial(){
  tutorial.step++;
  if (tutorial.step >= TUT_STEPS.length) endTutorial();
  else showTutorialStep(tutorial.step);
}

function endTutorial(){
  tutorial.active = false;
  $('tutorial').classList.add('hidden');
  $('laneHint').classList.add('hidden');
  $('jumpBtn').classList.remove('highlight');
  clearWorld();
  game.dist = 0; game.coins = 0; game.dodged = 0;
  game.speed = 20; game.spawnIn = 1.0;
  markFirstRunDone();
}
$('skipTut').addEventListener('click', endTutorial);

/* ============ 10. СПАВН ============ */
function spawnObstacle(lane, type, atZ){
  if (isNaN(lane)) return;
  const z = atZ ?? SPAWN_Z;
  const geo = type === 'low' ? obsGeoLow : obsGeoTall;
  const mat = type === 'low' ? obsMatLow : obsMatTall;
  const h   = type === 'low' ? 0.8 : 2.6;
  const m = new THREE.Mesh(geo, mat);
  m.position.set(LANES[lane], h / 2, z);
  m.userData.spin = (Math.random() - 0.5) * 0.9;
  scene.add(m);
  obstacles.push({ mesh: m, z, prevZ: z, height: h, type, hit: false, dodged: false });
}

function spawnCoinLine(lane, air, count, atZ){
  if (isNaN(lane)) return;
  const z0 = atZ ?? SPAWN_Z;
  for (let k = 0; k < count; k++){
    const isGold = !air && Math.random() < 0.08;
    const m = new THREE.Mesh(coinGeo, isGold ? coinMatGold : coinMat);
    m.position.set(LANES[lane], air ? 2.1 : 1.0, z0 - k * 2.0);
    scene.add(m);
    coinObjs.push({ mesh: m, z: m.position.z, prevZ: m.position.z, value: isGold ? 5 : 1 });
  }
}

function spawnRow(){
  const dist = game.dist;
  let maxObstacles;
  if (dist < 200)       maxObstacles = 1;
  else if (dist < 500)  maxObstacles = Math.random() < 0.45 ? 2 : 1;
  else if (dist < 1200) maxObstacles = Math.random() < 0.75 ? 2 : 1;
  else if (dist < 2500) maxObstacles = Math.random() < 0.55 ? 3 : 2;
  else                  maxObstacles = Math.random() < 0.70 ? 3 : 2;

  const pool = [0, 1, 2].sort(() => Math.random() - 0.5);
  const blocked = pool.slice(0, maxObstacles);
  const free    = pool.slice(maxObstacles);

  blocked.forEach(l => {
    const tallChance = 0.30 + Math.min(dist / 2000, 0.6) * 0.5;
    spawnObstacle(l, Math.random() < tallChance ? 'tall' : 'low');
  });
  if (free.length && Math.random() < 0.85){
    const coinLane = free[Math.floor(Math.random() * free.length)];
    const isAir    = Math.random() < 0.5;
    spawnCoinLine(coinLane, isAir, 2 + Math.floor(Math.random() * 3));
  }
}

function clearWorld(){
  obstacles.forEach(o => scene.remove(o.mesh)); obstacles = [];
  coinObjs.forEach(c => scene.remove(c.mesh));  coinObjs = [];
}

/* ============ 11. СТАРТ / КОНЕЦ ============ */
function resetGameState(){
  clearWorld();
  game.running  = true;
  game.lane     = 1;
  game.playerX  = 0; game.playerY = 0; game.vy = 0; game.onGround = true;
  game.speed    = 20; game.dist = 0; game.coins = 0; game.dodged = 0;
  game.spawnIn  = 1.2; game.tilt = 0; game.lanePop = 0;

  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  player.scale.set(1, 1, 1);
  trackTex.offset.y = 0;
  groundTex.offset.y = 0;

  $('hudScore').textContent = '0';
  $('hudCoins').textContent = '0';
  $('comboPill').classList.add('hidden');
}

function startRun(withTutorial){
  resetGameState();
  showScreen('game');
  clock.getDelta();
  // Обучение показываем только при первом запуске
  if (withTutorial && firstRun) startTutorial();
}

function currentScore(){ return Math.floor(game.dist) + game.coins * 10 + game.dodged * 3; }

function gameOver(){
  if (!game.running) return;
  game.running = false;
  beep(160, 0.3, 'sawtooth', 0.14);
  setTimeout(() => beep(90, 0.5, 'sawtooth', 0.10), 90);
  haptic(70);

  const score = currentScore();
  const dist  = Math.floor(game.dist);
  const coins = game.coins;
  const prevBest = records.length ? records[0].score : 0;

  records.push({ score, coins, dist, date: Date.now() });
  records.sort((a, b) => b.score - a.score);
  records = records.slice(0, 10);
  saveRecords();
  totalCoins += coins;
  saveCoins();

  $('goScore').textContent = score;
  $('goCoins').textContent = coins;
  $('goDist').textContent  = dist;
  $('goBest').textContent  = records[0].score;
  $('newRecord').classList.toggle('hidden', !(score > prevBest && prevBest > 0));

  setTimeout(() => showScreen('gameover'), 400);
}

/* ============ 12. ОБНОВЛЕНИЕ ============ */
function update(dt){
  game.speed = Math.min(20 + game.dist * 0.024, 55);
  const move = game.speed * dt;
  if (!tutorial.active) game.dist += move;

  // Плавный переход между полосами
  const targetX = LANES[game.lane] ?? 0;
  if (!isNaN(targetX)){
    game.playerX += (targetX - game.playerX) * Math.min(1, dt * 16);
  }
  game.tilt += (0 - game.tilt) * Math.min(1, dt * 10);
  game.lanePop = Math.max(0, game.lanePop - dt * 5);

  // Прыжок
  if (!game.onGround){
    game.vy += GRAVITY * dt;
    game.playerY += game.vy * dt;
    if (game.playerY <= 0){ game.playerY = 0; game.vy = 0; game.onGround = true; }
  }

  // Позиция и скейл игрока
  const bob = game.onGround ? Math.sin(performance.now() * 0.008) * 0.05 : 0;
  player.position.x = game.playerX;
  player.position.y = game.playerY + bob;
  player.rotation.z = -game.tilt;

  const stretch = 1 + Math.max(0, game.vy) * 0.012;
  const pop = 1 + game.lanePop * 0.22;
  player.scale.set(pop / stretch, stretch, pop / stretch);

  // Камера
  camera.position.y = CAM_BASE_Y + game.playerY * 0.28;
  camera.lookAt(0, 0.4 + game.playerY * 0.15, -12);

  // Тень
  shadow.position.x = game.playerX;
  const h = game.playerY;
  shadow.scale.setScalar(1 + h * 0.18);
  shadow.material.opacity = Math.max(0, 0.42 - h * 0.06);

  // Скролл текстур
  trackTex.offset.y  = (trackTex.offset.y  + move / TILE_LEN) % 1;
  groundTex.offset.y = (groundTex.offset.y + move / (480/60)) % 1;

  // Деревья
  for (const tr of trees){
    tr.z += move;
    if (tr.z > 15) resetTree(tr, false);
    tr.mesh.position.z = tr.z;
  }

  // Обычный спавн
  if (!tutorial.active){
    const gap = Math.max(12, 22 - game.dist * 0.003);
    game.spawnIn -= move;
    if (game.spawnIn <= 0){ spawnRow(); game.spawnIn = gap; }
  }

  // Препятствия
  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    o.prevZ = o.z;
    o.z += move;
    o.mesh.position.z = o.z;
    o.mesh.rotation.y += o.mesh.userData.spin * dt;
    if (o.z > REMOVE_Z){ scene.remove(o.mesh); obstacles.splice(i, 1); continue; }

    const inZone = o.prevZ < 1.0 && o.z > -1.0;
    if (inZone && !o.hit && Math.abs(o.mesh.position.x - game.playerX) < 1.15){
      o.hit = true;
      if (!tutorial.active && game.playerY < o.height - 0.12){ gameOver(); return; }
    }
    if (o.z > 1.0 && !o.hit && !o.dodged){
      o.dodged = true;
      if (!tutorial.active){
        game.dodged++;
        if (game.dodged % 5 === 0) beep(1100, 0.1, 'triangle', 0.05);
      }
    }
  }

  // Монеты
  for (let i = coinObjs.length - 1; i >= 0; i--){
    const c = coinObjs[i];
    c.prevZ = c.z;
    c.z += move;
    c.mesh.position.z = c.z;
    c.mesh.rotation.y += dt * 7;
    if (c.z > REMOVE_Z){ scene.remove(c.mesh); coinObjs.splice(i, 1); continue; }

    const inZone = c.prevZ < 0.8 && c.z > -0.8;
    if (inZone && Math.abs(c.mesh.position.x - game.playerX) < 1.0){
      const pyLow  = game.playerY;
      const pyHigh = game.playerY + 1.4;
      const cy = c.mesh.position.y;
      if (pyHigh > cy - 0.55 && pyLow < cy + 0.55){
        scene.remove(c.mesh); coinObjs.splice(i, 1);
        game.coins += c.value;
        beep(c.value > 1 ? 1200 : 880 + Math.random()*100, 0.07, 'square', 0.05);
        haptic(6);
      }
    }
  }

  if (tutorial.active) updateTutorial(dt);

  $('hudScore').textContent = currentScore();
  $('hudCoins').textContent = game.coins;
  const comboPill = $('comboPill');
  if (game.dodged >= 3){
    comboPill.classList.remove('hidden');
    $('hudCombo').textContent = game.dodged;
  } else {
    comboPill.classList.add('hidden');
  }
}

function updateTutorial(dt){
  const w = tutorial.waitFor;
  if (w === 'lane0' && game.lane === 0) advanceTutorial();
  else if (w === 'lane2' && game.lane === 2) advanceTutorial();
  else if (w === 'lane1' && game.lane === 1) advanceTutorial();
  else if (w === 'jump'  && !game.onGround) advanceTutorial();
  else if (w === 'done'){
    tutorial.timer += dt;
    if (tutorial.timer > 1.2) advanceTutorial();
  } else {
    // Авто-пропуск застрявшего шага (защита от «вечного» обучения)
    tutorial.stuckTimer += dt;
    if (tutorial.stuckTimer > 8){
      tutorial.stuckTimer = 0;
      advanceTutorial();
    }
  }
}

/* ============ 13. ЦИКЛ ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.06);
  if (game.running) update(dt);
  renderer.render(scene, camera);
}

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 70 : 64;
  camZ = aspect < 1 ? 10.5 : 9.5;
  camera.position.set(0, CAM_BASE_Y, camZ);
  camera.lookAt(0, 0.4, -12);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

/* ============ 14. СТАРТ ============ */
applyLang();
showScreen('menu');
animate();
</script>
